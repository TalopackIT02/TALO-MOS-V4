openapi: 3.1.0
info:
  title: TALO-MOS-V4 Authentication API
  version: 1.0.0
  description: >
    Contract v1 (AUTH-B1.1, finalized). Design only — no endpoint is implemented yet; this describes the required behaviour.
    Narrative rules (lifecycle, processing order, H-b lockout with D = 30 s, writer protocol, audit, contract tests)
    are in AUTH-API-v1.md and take precedence. All security times come from PostgreSQL. Passwords: NFC, 8-128 code
    points, at most 512 UTF-8 bytes, not trimmed, Argon2id via @node-rs/argon2 (local baseline m=19 MiB, t=2, p=1).
    Values listed as PENDING in AUTH-API-v1.md section 13.2 are intentionally not specified here. INV-10 is NOT
    VERIFIED until the implementation passes the contract tests (blockers IB-1..IB-3, AUTH-API-v1.md section 4.5).
servers:
  - url: http://127.0.0.1:3000/api
    description: local development (Vite proxies /api from http://127.0.0.1:5173)
tags:
  - name: auth
    description: Login, first password change, session description and logout (AUTH-API-v1.md).
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Verify username and password; issue an Activation or an Authenticated Session.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated Session or Activation Session issued (see `status`).
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginAuthenticated'
                  - $ref: '#/components/schemas/LoginPasswordChangeRequired'
                discriminator:
                  propertyName: status
                  mapping:
                    AUTHENTICATED: '#/components/schemas/LoginAuthenticated'
                    PASSWORD_CHANGE_REQUIRED: '#/components/schemas/LoginPasswordChangeRequired'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: >
            Uniform failure (INV-10) for unknown username, no credential, wrong password, temporary lock, no attempt
            slot, credential changed, attempt deadline exceeded, stale success on a locked cycle. Status, headers and
            body are identical except `requestId` / X-Request-Id (a fresh UUID v4 per request, accepted to differ;
            contract tests normalise it). No Set-Cookie, no Retry-After. A database error never produces this 401.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { error: { code: INVALID_CREDENTIALS, message: '<P-11>', requestId: 00000000-0000-4000-8000-000000000000 } }
        '403':
          description: ACCOUNT_NOT_ALLOWED (correct password, ineligible account/membership) or ORIGIN_NOT_ALLOWED (CSRF X1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: RATE_LIMITED — local limit 60 login requests per 15 minutes per client IP, before validation and Argon2.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
  /auth/password/first-change:
    post:
      tags: [auth]
      operationId: firstChangePassword
      summary: Set the first personal password; activates the account, revokes all sessions, requires a new login.
      security:
        - activationSession: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstChangeRequest' }
      responses:
        '200':
          description: Password changed. All sessions (including this one) revoked; cookie cleared; log in again (D-B1-1).
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearCookie' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstChangeSuccess' }
        '400':
          description: PASSWORD_POLICY (with details.reason) or VALIDATION_ERROR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '403':
          description: NOT_REQUIRED (Authenticated Session) or ORIGIN_NOT_ALLOWED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Describe the current session. Never extends an Activation Session; counts as activity otherwise.
      security:
        - activationSession: []
        - authenticatedSession: []
      responses:
        '200':
          description: Current session.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionAuthenticated'
                  - $ref: '#/components/schemas/SessionActivation'
                discriminator:
                  propertyName: status
                  mapping:
                    AUTHENTICATED: '#/components/schemas/SessionAuthenticated'
                    PASSWORD_CHANGE_REQUIRED: '#/components/schemas/SessionActivation'
        '401': { $ref: '#/components/responses/SessionInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session. Always 204 (idempotent), cookie cleared.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Logged out (or nothing to log out).
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearCookie' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '403':
          description: ORIGIN_NOT_ALLOWED (CSRF X1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    activationSession:
      type: apiKey
      in: cookie
      name: talo_sid
      description: Activation Session (15 min, not extended); allowed only on first-change, session, logout.
    authenticatedSession:
      type: apiKey
      in: cookie
      name: talo_sid
      description: Authenticated Session (10 h absolute, 60 min idle).
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: CSRF X1 — must equal an APP_ORIGIN entry; requests also need Content-Type application/json.
      schema: { type: string, examples: ['http://127.0.0.1:5173'] }
  headers:
    SessionCookie:
      description: 'talo_sid=<32-byte base64url token>; HttpOnly; SameSite=Strict; Path=/ (+ Secure in production). No Max-Age/Expires.'
      schema: { type: string }
    ClearCookie:
      description: 'talo_sid=; Max-Age=0; HttpOnly; SameSite=Strict; Path=/'
      schema: { type: string }
    RequestId:
      description: Server-generated UUID v4.
      schema: { type: string, format: uuid }
    NoStore:
      schema: { type: string, const: no-store }
  responses:
    ValidationError:
      description: VALIDATION_ERROR or INVALID_JSON (input only, independent of any account).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SessionInvalid:
      description: SESSION_INVALID — missing, unknown, expired, idle, revoked or ineligible session; cookie cleared.
      headers:
        Set-Cookie: { $ref: '#/components/headers/ClearCookie' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE (body over 10 kB).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE (POST without application/json).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: RATE_LIMITED — per IP, before any password hashing (P-7). Threshold for this endpoint PENDING.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceBusy:
      description: >
        SERVICE_BUSY — (a) password-hashing queue full or timed out (global, limits PENDING with P-6b); or (b) the
        database transaction failed with 40P01/40001 and its single retry failed too (or no retry was allowed). Case (b)
        is reachable on login only after the correct password was verified, on first-change only with a valid
        Activation Session. Never replaced by 401. No session issued, no state change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: >
        INTERNAL_ERROR — unexpected, non-retryable error. On login it must not depend on whether the account exists
        (implementation blocker IB-1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - PASSWORD_POLICY
                - INVALID_CREDENTIALS
                - SESSION_INVALID
                - ACCOUNT_NOT_ALLOWED
                - PASSWORD_CHANGE_REQUIRED
                - NOT_REQUIRED
                - ORIGIN_NOT_ALLOWED
                - NOT_FOUND
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL_ERROR
                - SERVICE_BUSY
            message: { type: string, description: Vietnamese text (P-11). }
            requestId: { type: string, format: uuid }
            details: { $ref: '#/components/schemas/PasswordPolicyDetails' }
    PasswordPolicyDetails:
      type: object
      description: Present only with PASSWORD_POLICY. Never reveals the matched blocklist entry.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [TOO_SHORT, TOO_LONG, TOO_LONG_BYTES, BLOCKLISTED, CONTEXT_MATCH, SAME_AS_CURRENT, CONTROL_CHARACTERS]
        minLength: { type: integer, const: 8 }
        maxLength: { type: integer, const: 128 }
        maxBytes: { type: integer, const: 512 }
    LoginRequest:
      type: object
      description: >
        There is deliberately no `remember` field: "Ghi nhớ tên đăng nhập" stores only the username in the browser and
        never affects sessions. Unknown properties are rejected.
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 80, description: Trimmed; compared case-insensitively. }
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Not trimmed; NFC-normalised server-side; at most 128 code points and 512 UTF-8 bytes; no C0
            (U+0000-U+001F), DEL (U+007F) or C1 (U+0080-U+009F) control character (400 VALIDATION_ERROR).
    AccountSummary:
      type: object
      required: [userAccountId, username, fullName]
      additionalProperties: false
      properties:
        userAccountId: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
    ActivationAccount:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string }
    LoginAuthenticated:
      type: object
      required: [status, account, assuranceLevel, expiresAt, serverTime]
      additionalProperties: false
      properties:
        status: { type: string, const: AUTHENTICATED }
        account: { $ref: '#/components/schemas/AccountSummary' }
        assuranceLevel: { type: integer, const: 1 }
        expiresAt: { type: string, format: date-time, description: PostgreSQL time; created_at + 10 hours. }
        serverTime: { type: string, format: date-time }
    LoginPasswordChangeRequired:
      type: object
      required: [status, account, expiresAt, serverTime]
      additionalProperties: false
      properties:
        status: { type: string, const: PASSWORD_CHANGE_REQUIRED }
        account: { $ref: '#/components/schemas/ActivationAccount' }
        expiresAt: { type: string, format: date-time, description: PostgreSQL time; created_at + 15 minutes. }
        serverTime: { type: string, format: date-time }
    FirstChangeRequest:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword:
          type: string
          description: >
            Not trimmed. The server NFC-normalises, then enforces 8-128 code points, at most 512 UTF-8 bytes, no C0/DEL/C1
            control character, case-insensitive whole-password contextual checks, the offline breached-password check
            (Have I Been Pwned, whole password, at most 5 case variants — not full case-insensitivity), and difference
            from the current password (Argon2id verify against the current hash); violations return 400 PASSWORD_POLICY
            with details.reason (not VALIDATION_ERROR). The UI's confirmation field is compared client-side and is not
            sent.
    FirstChangeSuccess:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, const: PASSWORD_CHANGED_RELOGIN }
    SessionAuthenticated:
      type: object
      required: [status, account, assuranceLevel, expiresAt, idleExpiresAt, serverTime]
      additionalProperties: false
      properties:
        status: { type: string, const: AUTHENTICATED }
        account: { $ref: '#/components/schemas/AccountSummary' }
        assuranceLevel: { type: integer, const: 1 }
        expiresAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time, description: last_seen_at + 60 minutes. }
        serverTime: { type: string, format: date-time }
    SessionActivation:
      type: object
      required: [status, account, expiresAt, serverTime]
      additionalProperties: false
      properties:
        status: { type: string, const: PASSWORD_CHANGE_REQUIRED }
        account: { $ref: '#/components/schemas/ActivationAccount' }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
