t-size:12px}.sub button:hover,.sub button.active{background:#ebf8f0;color:var(--green)}.sub button.active{font-weight:700}.foot{border-top:1px solid var(--line);padding:9px}.foot button{border:0;background:white;color:#56697c;padding:12px;width:100%;text-align:left;border-radius:6px;font-size:12px}.foot button:hover{background:#ecf8f1}.compact .nav-label,.compact .chevron,.compact .foot-label{display:none}.compact .nav-btn{justify-content:center;padding:11px 0}.compact .sub{display:none}.compact .foot button{text-align:center}.compact .nav{overflow:visible}.menu-entry{position:relative}.flyout{display:none;position:absolute;left:calc(100% + 7px);top:0;min-width:210px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px #20304022;border-radius:9px;padding:7px;z-index:20}.compact .menu-entry.flyout-open>.flyout{display:block}.flyout strong{display:block;padding:10px;color:var(--green);font-size:12px;border-bottom:1px solid var(--line)}.flyout button{width:100%;background:#fff;border:0;text-align:left;padding:11px;border-radius:6px;color:#516175;font-size:12px}.flyout button:hover{background:#e4f5eb}.workspace{min-width:0;overflow:auto;padding:22px 25px 34px}.crumb{font-size:12px;color:#718195;margin-bottom:18px}.page-heading{margin-bottom:19px}.page-heading .tabs{padding:15px 0 0;border:0;background:transparent}.page-heading .tab{border-radius:8px;border:1px solid #dce6e1;padding:9px 14px;background:#fff;color:#526274;box-shadow:none;transition:background .15s,border-color .15s,color .15s}.page-heading .tab:hover{background:#f2f8f4;border-color:#bddecb}.page-heading .tab.active{background:#087f45;color:#fff;border-color:#087f45;font-weight:600}.page-heading h1{font-size:24px;color:var(--green);margin:0 0 5px;letter-spacing:-.2px}.page-heading p{font-size:13px;color:var(--muted);margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:16px;box-shadow:0 2px 8px #24374707}.panel-heading{padding:18px 20px;border-bottom:1px solid #eef2f4;display:flex;justify-content:space-between;align-items:center}.panel-heading h2{font-size:15px;margin:0}.muted{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:15px 20px}.tab{background:white;border:1px solid #d6e1e7;border-radius:7px;color:#4c5d70;font-size:12px;padding:9px 13px}.tab.active{background:#e3f5eb;color:var(--green);border-color:#bddfc9;font-weight:700}.panel-body{padding:19px 20px 22px}.info{color:#506176;font-size:13px;line-height:1.7;margin:0 0 17px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;min-width:540px;font-size:12px}th{text-align:left;padding:13px;background:#f8fafb;color:#637489;border-bottom:1px solid var(--line)}td{padding:15px 13px;border-bottom:1px solid #edf1f4}tr:last-child td{border:0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#f0f4f6;color:#67788a;font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:8px;padding:17px}.card b{font-size:14px}.card p{font-size:12px;color:var(--muted);line-height:1.7;margin:9px 0 0}.note{border-left:3px solid #b8d7c6;background:#f7faf8;padding:12px 14px;font-size:12px;color:#637488;margin-top:16px;line-height:1.6}.footer{color:#90a0ae;font-size:11px;margin-top:20px}@media(max-width:800px){.company{display:none}.workspace{padding:18px}.cards{grid-template-columns:1fr}.search{width:190px}}@media(max-width:540px){.top{padding:0 10px;gap:8px}.brand img{width:100px}.search{display:none}.user div:last-child{display:none}.layout:not(.compact){--side:190px}.workspace{padding:12px}.page-heading h1{font-size:20px}}
/* Brand: symbol → wordmark → company name */
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* Structural alignment: logo column and sidebar share the exact same width */
:root{--side:244px}
.top{padding:0;gap:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.brand-zone{height:70px;width:100%;min-width:0;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 20px;background:#fff;overflow:hidden}
.brand{gap:7px;min-width:0;flex-wrap:nowrap}
.brand img.brand-symbol{width:47px;height:47px;flex:none}
.brand img.brand-name{width:145px;height:47px;min-width:0;object-fit:contain}
.top-main{display:flex;align-items:center;gap:20px;min-width:0;padding:0 24px;height:70px}
.company{border-left:0;padding-left:0;color:#07533b;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.layout{grid-template-columns:var(--side) minmax(0,1fr)}
body.sidebar-compact{--side:62px}

body.sidebar-compact .brand img.brand-name{display:none}
.mobile-menu{display:none;width:36px;height:36px;border:0;border-radius:7px;background:#eff7f2;color:#087f45;font-size:21px;flex:none}

@media(max-width:760px){

 .brand img.brand-symbol,body.sidebar-compact .brand img.brand-symbol{width:36px;height:36px}
 .brand img.brand-name,body.sidebar-compact .brand img.brand-name{display:block;width:119px;height:36px}
 .top-main{display:none}
 .mobile-menu{display:none}
 .company{font-size:clamp(13px,3.5vw,17px);flex:1;white-space:nowrap}
 .top-main .search,.top-main .user{display:none}
 .layout,.layout.compact{display:block;height:calc(100dvh - 52px);min-height:0}
 .sidebar{position:fixed;z-index:80;left:0;top:52px;bottom:calc(64px + env(safe-area-inset-bottom, 0px));width:min(280px,84vw);transform:translateX(-102%);transition:transform .2s ease;box-shadow:12px 0 30px #10223818}
 body.mobile-open .sidebar{transform:translateX(0)}
 body.mobile-open .mobile-overlay{display:block;position:fixed;z-index:70;inset:52px 0 calc(64px + env(safe-area-inset-bottom, 0px));background:#162a3280}
 .workspace{height:calc(100dvh - 52px);padding:17px 14px calc(92px + env(safe-area-inset-bottom, 0px))}

 .compact .sub{display:none}

 .compact .nav{overflow-y:auto}
 .compact .flyout{display:none!important}
 .cards{grid-template-columns:1fr}
 .panel-heading{padding:15px}
 .panel-body{padding:15px}
 .page-heading h1{font-size:21px}
 .company{border:none}
}

/* Mobile-only icon navigation: desktop layout remains unchanged. */
.mobile-bottom-nav{display:none}
.mobile-account-panel{display:none}

 .mobile-account-panel{position:fixed;z-index:95;bottom:calc(74px + env(safe-area-inset-bottom, 0px));left:12px;right:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 35px #14273926}

 body.mobile-account-open .mobile-overlay{display:block;position:fixed;z-index:70;inset:52px 0 calc(64px + env(safe-area-inset-bottom, 0px));background:#162a3280}
}
</style></head><body><header class="top"><div class="brand-zone"><div class="brand"><img class="brand-symbol" src="src/assets/images/talopack-symbol.png" alt="Biểu tượng Tăng Long Pack"><img class="brand-name" src="src/assets/images/talopack-name.png" alt="TALOPACK"></div></div><div class="top-main"><button type="button" id="mobileMenuBtn" class="mobile-menu" onclick="toggleMobile()" aria-label="Mở menu" aria-expanded="false">☰</button><div class="company">Công ty TNHH Tăng Long Pack</div><div class="grow"></div><input class="search" type="search" id="search" placeholder="Tìm kiếm màn hình..." aria-label="Tìm màn hình"><div class="user"><span class="avatar">A</span><div><strong>Tài khoản đăng nhập</strong><small>Phiên demo giao diện</small></div></div></div></header><div class="mobile-overlay" id="mobileOverlay" onclick="closeMobile()"></div><div class="mobile-account-panel" id="mobileAccountPanel" aria-hidden="true"><strong>Cá nhân</strong><p>Thông tin tài khoản sẽ hiển thị khi kết nối phiên đăng nhập thực tế.</p></div><nav class="mobile-bottom-nav" aria-label="Điều hướng điện thoại"><button id="mobileBottomMenu" type="button" onclick="toggleMobile()" aria-label="Menu" title="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="mobileBottomHome" type="button" onclick="navigate('home')" aria-label="Trang chủ" title="Trang chủ"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg></button><button id="mobileBottomAccount" type="button" onclick="toggleMobileAccount()" aria-label="Cá nhân" title="Cá nhân" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button></nav><div class="layout" id="layout"><aside class="sidebar"><nav class="nav" id="nav" aria-label="Điều hướng"></nav><div class="foot"><button onclick="collapse()"><span id="collapseIcon">‹</span> <span class="foot-label">Thu gọn</span></button></div></aside><main class="workspace"><div class="crumb" id="crumb"></div><div class="page-heading"><h1 id="title"></h1><p id="desc"></p><div class="tabs" id="tabs" aria-label="Chức năng"></div></div><section class="panel"><div class="panel-heading"><h2 id="bodyTitle"></h2></div><div class="panel-body" id="body"></div></section><div class="footer">HTML DEMO · Không kết nối API hay database · Các thao tác thay đổi dữ liệu chưa được kích hoạt.</div></main></div><script>
const pages={home:{name:'Trang chủ',desc:'Điều hướng đến những màn hình nền tảng đang được ưu tiên triển khai.',tabs:['Màn hình ưu tiên']},module:{name:'Quản lý Module',desc:'Tiếp nhận và quản lý thông tin module được đăng ký với Foundation.',tabs:['Danh sách Module','Thông tin khai báo']},capability:{name:'Quản lý chức năng',desc:'Quản lý danh mục chức năng và hành động do module công bố.',tabs:['Cây chức năng','Danh sách Action']},accounts:{name:'Quản lý tài khoản',desc:'Giao diện quản trị tài khoản thuộc IAM, chưa kết nối dữ liệu thực.',tabs:['Danh sách tài khoản','Chi tiết tài khoản']},roles:{name:'Vai trò và quyền',desc:'Giao diện quản trị vai trò và quyền truy cập ứng dụng.',tabs:['Danh sách vai trò','Phân quyền']}};
const groups=[{id:'foundation',name:'Foundation',icon:'⚙',children:['module','capability']},{id:'iam',name:'IAM · Tài khoản và quyền',icon:'♙',children:['accounts','roles']}];let selected='home',activeTab=0,expanded=new Set(['foundation']),pinnedFlyout=null;function bodyTable(cols,rows){return '<div class="tablewrap"><table><thead><tr>'+cols.map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}const note='<div class="note">Đây là cấu trúc màn hình demo, không đại diện cho chức năng hoặc dữ liệu đã hoàn thành trong ứng dụng.</div>';function content(){if(selected==='home')return '<p class="info">Các màn hình nằm trong phạm vi triển khai AppShell hiện tại. Các phân hệ nghiệp vụ chưa phát triển không được đưa vào menu.</p><div class="cards"><div class="card"><b>Foundation</b><p>Đăng ký Module và tiếp nhận danh sách chức năng, hành động.</p></div><div class="card"><b>IAM</b><p>Tài khoản, vai trò và quyền sử dụng các chức năng.</p></div><div class="card"><b>AppShell</b><p>Topbar, Sidebar có menu con, Breadcrumb và khung nội dung.</p></div></div>';if(selected==='module')return activeTab===0?'<p class="info">Danh sách mô tả phạm vi quản lý module, không khẳng định đã có registry chạy thực tế.</p>'+bodyTable(['Module','Chức năng','Trạng thái'],[['Foundation','Khung nền và quản lý chức năng','<span class="tag">Màn hình mẫu</span>'],['IAM','Tài khoản và phân quyền','<span class="tag">Màn hình mẫu</span>']])+note:bodyTable(['Trường','Mô tả'],[['module_key','Định danh module'],['module_name','Tên hiển thị'],['module_version','Phiên bản module'],['contract_version','Phiên bản hợp đồng công bố']])+note;if(selected==='capability')return activeTab===0?'<p class="info">Module công bố các Function và Action. Foundation tiếp nhận để tổ chức điều hướng; IAM dùng danh mục đã công bố để xác định quyền.</p>'+bodyTable(['Cấp','Ý nghĩa'],[['Module','Phân hệ sở hữu'],['Function','Màn hình hoặc chức năng'],['Action','Hành động của chức năng']])+note:bodyTable(['Trường','Ý nghĩa'],[['module_key','Module sở hữu'],['function_key','Chức năng'],['action_key','Hành động'],['route','Đường dẫn, nếu chức năng có màn hình']])+note;if(selected==='accounts')return activeTab===0?'<p class="info">Chưa kết nối API quản lý tài khoản. Danh sách chưa có dữ liệu thực.</p>'+bodyTable(['Tài khoản','Trạng thái','Vai trò'],[['Chưa có dữ liệu','—','—']])+note:bodyTable(['Nhóm thông tin','Trường dự kiến'],[['Định danh','Tên đăng nhập'],['Tài khoản','Trạng thái'],['Phân quyền','Vai trò được gán']])+note;if(selected==='roles')return activeTab===0?'<p class="info">Danh sách vai trò sẽ được tải từ IAM khi kết nối API.</p>'+bodyTable(['Tên vai trò','Trạng thái'],[['Chưa có dữ liệu','—']])+note:'<p class="info">Quyền truy cập ứng dụng được tham chiếu từ danh mục Function / Action. Màn hình này chưa ghi thay đổi quyền.</p>'+bodyTable(['Thành phần','Nội dung'],[['Role','Vai trò được chọn'],['Function','Chức năng ứng dụng'],['Action','Quyền thao tác']])+note;return ''}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='<div class="menu-entry"><button class="nav-btn '+(selected==='home'?'active':'')+'" onclick="navigate(\'home\')" title="Trang chủ"><span class="icon">⌂</span><span class="nav-label">Trang chủ</span></button></div>'+groups.map(g=>'<div class="menu-entry '+(expanded.has(g.id)?'expanded':'')+' '+(pinnedFlyout===g.id?'flyout-open':'')+'"><button class="nav-btn '+(g.children.includes(selected)?'parent-active':'')+'" onclick="toggle(\''+g.id+'\')" aria-expanded="'+expanded.has(g.id)+'" title="'+g.name+'"><span class="icon">'+g.icon+'</span><span class="nav-label">'+g.name+'</span><span class="chevron">›</span></button><div class="sub">'+g.children.map(id=>'<button class="'+(selected===id?'active':'')+'" onclick="navigate(\''+id+'\')">'+pages[id].name+'</button>').join('')+'</div><div class="flyout"><strong>'+g.name+'</strong>'+g.children.map(id=>'<button onclick="navigate(\''+id+'\')">'+pages[id].name+'</button>').join('')+'</div></div>').join('')}
function render(){const p=pages[selected];let parent=groups.find(g=>g.children.includes(selected));document.getElementById('crumb').textContent=selected==='home'?'Trang chủ':(parent.name+' › '+p.name);document.getElementById('title').textContent=p.name.toLocaleUpperCase('vi');document.getElementById('desc').textContent=p.desc;document.getElementById('bodyTitle').textContent=p.tabs[activeTab];document.getElementById('tabs').innerHTML=p.tabs.map((x,i)=>'<button class="tab '+(i===activeTab?'active':'')+'" onclick="changeTab('+i+')">'+x+'</button>').join('');document.getElementById('body').innerHTML=content();renderNav();syncBottomNav()}
function navigate(id){if(window.matchMedia('(max-width:760px)').matches){closeMobile();closeMobileAccount();}pinnedFlyout=null;selected=id;activeTab=0;const g=groups.find(x=>x.children.includes(id));if(g)expanded.add(g.id);render()}function toggle(id){if(window.matchMedia('(max-width:760px)').matches){expanded.has(id)?expanded.delete(id):expanded.add(id);renderNav();return}if(document.getElementById('layout').classList.contains('compact')){pinnedFlyout=pinnedFlyout===id?null:id}else{expanded.has(id)?expanded.delete(id):expanded.add(id);pinnedFlyout=null}renderNav()}function changeTab(t){activeTab=t;render()}function collapse(){pinnedFlyout=null;const on=document.getElementById('layout').classList.toggle('compact');document.body.classList.toggle('sidebar-compact',on);document.getElementById('collapseIcon').textContent=on?'›':'‹';document.querySelector('.foot-label').textContent=on?'Mở rộng':'Thu gọn';renderNav()}function syncBottomNav(){
 const home=document.getElementById('mobileBottomHome'),menu=document.getElementById('mobileBottomMenu'),account=document.getElementById('mobileBottomAccount');
 menu.classList.toggle('active',document.body.classList.contains('mobile-open'));
 home.classList.toggle('active',selected==='home'&&!document.body.classList.contains('mobile-open')&&!document.body.classList.contains('mobile-account-open'));
 account.classList.toggle('active',document.body.classList.contains('mobile-account-open'));
 menu.setAttribute('aria-expanded',String(document.body.classList.contains('mobile-open')));
 account.setAttribute('aria-expanded',String(document.body.classList.contains('mobile-account-open')));
}
function toggleMobile(){
 closeMobileAccount();document.body.classList.toggle('mobile-open');syncBottomNav();
}
function closeMobile(){document.body.classList.remove('mobile-open');syncBottomNav()}
function toggleMobileAccount(){
 const opening=!document.body.classList.contains('mobile-account-open');
 closeMobile();document.body.classList.toggle('mobile-account-open',opening);
 const panel=document.getElementById('mobileAccountPanel');panel.classList.toggle('open',opening);panel.setAttribute('aria-hidden',String(!opening));syncBottomNav();

function closeMobileAccount(){
 document.body.classList.remove('mobile-account-open');const panel=document.getElementById('mobileAccountPanel');panel.classList.remove('open');panel.setAttribute('aria-hidden','true');syncBottomNav();
