<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TALOPACK | Đăng nhập hệ thống (Demo)</title>
  <style>
    :root { --green: #0fa958; --green-hover: #0b8e4a; --ink:#3d2a20; --muted:#7b8492; --line:#d8dee6; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { min-height:100dvh; font-family:Arial,"Segoe UI",sans-serif; color:#171e2c; background:#f3f5f7; display:flex; justify-content:center; align-items:center; padding:16px 20px; overflow:hidden; }
    /* Desktop: container always follows viewport height. Width is scaled against the original 1280:760 design ratio. */
    .login-shell { width:min(1280px, calc((100dvh - 32px) * 1.68421), calc(100vw - 40px)); height:calc(100dvh - 32px); max-height:760px; display:grid; grid-template-columns:40% 60%; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; box-shadow:0 12px 34px rgba(39,54,71,.10); }
    .login-panel { min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(18px,4vh,48px) clamp(22px,3vw,40px) 24px; overflow-y:auto; }
    .logo { display:block; width:min(300px,90%); max-height:clamp(120px,24vh,220px); height:auto; object-fit:contain; margin:0 auto clamp(14px,3vh,28px); }
    h1 { margin:0; text-align:center; color:var(--ink); font-size:clamp(20px,2vw,24px); line-height:1.3; font-weight:700; }
    .subtitle { margin:8px -10px clamp(16px,3vh,30px); text-align:center; color:var(--muted); font-size:14px; line-height:1.55; }
    .login-form { width:100%; max-width:440px; }
    .field { position:relative; display:block; margin-bottom:16px; }
    .field input { width:100%; height:52px; padding:0 48px; outline:0; border:1px solid var(--line); border-radius:6px; background:#fff; color:#1f2937; font:400 15px Arial,"Segoe UI",sans-serif; }
    .field input::placeholder { color:#9099a8; }
    .field input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(15,169,88,.10); }
    .field-icon { position:absolute; width:21px; height:21px; left:17px; top:15px; color:#6b7788; pointer-events:none; }
    .password-toggle { position:absolute; top:7px; right:10px; width:39px; height:39px; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:#657386; cursor:pointer; }
    .password-toggle:hover { background:#f3f5f7; }
    .password-toggle svg { width:21px; height:21px; }
    .options { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:24px 0; font-size:14px; }
    .remember { display:flex; align-items:center; gap:8px; white-space:nowrap; cursor:pointer; }
    .remember input { width:18px; height:18px; accent-color:var(--green); margin:0; cursor:pointer; }
    .forgot { padding:4px 0; color:var(--green); border:0; background:transparent; font-size:14px; white-space:nowrap; cursor:pointer; }
    .forgot:hover { text-decoration:underline; }
    .login-button { width:100%; height:56px; display:flex; align-items:center; justify-content:center; gap:12px; border:0; border-radius:6px; background:var(--green); color:#fff; font:700 16px Arial,"Segoe UI",sans-serif; cursor:pointer; }
    .login-button:hover { background:var(--green-hover); }
    .login-button:disabled { opacity:.6; cursor:not-allowed; }
    .login-button:focus-visible, .forgot:focus-visible, .password-toggle:focus-visible { outline:3px solid #a0e6c5; outline-offset:2px; }
    .message { font-size:13px; line-height:1.5; margin:12px 0 0; color:#ad3939; }
    .message:empty { display:none; }
    .footer { margin-top:clamp(16px,4vh,38px); color:#929aa5; text-align:center; font-size:13px; }
    .illustration { min-height:0; overflow:hidden; background:#f4f8f6; }
    .illustration img { display:block; width:100%; height:100%; object-fit:cover; object-position:center center; }
    /* Tablet: maintain viewport-height frame and prioritize form; decorative photo stays visible. */
    @media (max-width:1080px) and (min-width:641px) {
      body { padding:16px; }
      .login-shell { width:calc(100vw - 32px); height:calc(100dvh - 32px); max-height:none; grid-template-columns:46% 54%; }
      .login-panel { padding:24px; }
      .logo { width:min(245px,90%); }
      .subtitle { font-size:13px; }
      .options { font-size:13px; }
      .forgot { font-size:13px; }
    }
    /* Mobile: photo is only on a separate background layer, with a translucent white veil. */
    @media (max-width:640px) {
      body { padding:0; background:#f4f8f6; }
      .login-shell { position:relative; isolation:isolate; display:flex; align-items:center; justify-content:center; width:100vw; height:100dvh; max-height:none; border:0; border-radius:0; box-shadow:none; background:transparent; }
      .login-shell::before { content:""; position:absolute; z-index:-2; inset:0; background:url("./src/assets/images/warehouse-illustration.png") center center / cover no-repeat; }
      .login-shell::after { content:""; position:absolute; z-index:-1; inset:0; background:rgba(255,255,255,.82); }
      .illustration { display:none; }
      .login-panel { position:relative; width:100%; max-width:440px; max-height:100%; min-height:0; padding:clamp(20px,5vh,48px) 24px; overflow-y:auto; background:rgba(255,255,255,.35); border-radius:12px; }
      .logo { width:min(235px,75%); max-height:clamp(120px,21dvh,195px); margin-bottom:clamp(14px,3dvh,25px); }
      h1 { font-size:clamp(20px,5vw,23px); }
      .subtitle { font-size:13px; margin:8px 0 clamp(20px,4dvh,30px); }
      .field { margin-bottom:14px; }
      .field input { height:50px; background:rgba(255,255,255,.96); }
      .field-icon { top:14px; }
      .password-toggle { top:5px; }
      .options { margin:20px 0; gap:8px; font-size:13px; }
      .forgot { font-size:13px; }
      .login-button { height:52px; }
      .footer { margin-top:clamp(18px,4dvh,32px); }
    }
    @media(max-width:360px){ .login-panel{padding-left:16px;padding-right:16px;} .options,.forgot{font-size:12px;} }
    @media(max-height:620px) and (min-width:641px){ .logo { max-height:120px; margin-bottom:12px; } .subtitle { margin-bottom:12px; } .field { margin-bottom:10px; } .options { margin:12px 0; } .footer { margin-top:12px; } }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <img class="logo" src="./src/assets/images/talopack-logo.png" alt="TALOPACK" />
      <h1 id="login-title">ĐĂNG NHẬP HỆ THỐNG</h1>
      <p class="subtitle">Quản lý sản xuất - Kho vận - Kinh doanh - Toàn diện</p>
      <form class="login-form" id="login-form" novalidate>
        <label class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.2" r="4.1"/><path d="M3.2 21v-2.2c0-4 3.8-6.6 8.8-6.6s8.8 2.6 8.8 6.6V21Z"/></svg>
          <input id="username" name="username" type="text" autocomplete="username" aria-label="Tên đăng nhập" placeholder="Tên đăng nhập" />
        </label>
        <label class="field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4.2" y="10.2" width="15.6" height="11" rx="2"/><path d="M8 10.2V7a4 4 0 0 1 8 0v3.2"/><circle cx="12" cy="15.2" r="1" fill="currentColor"/><path d="M12 16v2"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-label="Mật khẩu" placeholder="Mật khẩu" />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện hoặc ẩn mật khẩu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.7-6 10-6 10 6 10 6-3.7 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </label>
        <div class="options">
          <label class="remember"><input type="checkbox" checked /> Ghi nhớ đăng nhập</label>
          <button class="forgot" type="button" id="forgot-button">Quên mật khẩu?</button>
        </div>
        <button class="login-button" type="submit">ĐĂNG NHẬP <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <footer class="footer">© 2026 TALOPACK</footer>
    </section>
    <aside class="illustration" aria-label="Minh họa nhà kho TALOPACK"><img src="./src/assets/images/warehouse-illustration.png" alt="Nhà kho và hoạt động vận chuyển TALOPACK" /></aside>
  </main>
  <script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('password-toggle');
    const message = document.getElementById('message');
    toggle.addEventListener('click', () => {
      const visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(visible));
      toggle.setAttribute('aria-label', visible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
    document.getElementById('forgot-button').addEventListener('click', () => {
      message.style.color = '#ad3939';
      message.textContent = 'Chức năng quên mật khẩu chưa được tích hợp trong bản demo.';
    });
    document.getElementById('login-form').addEventListener('submit', event => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const hasPassword = password.value.length > 0;
      message.style.color = username && hasPassword ? '#0b8e4a' : '#ad3939';
      message.textContent = username && hasPassword ? 'Đây là bản demo giao diện, chưa kết nối hệ thống đăng nhập.' : 'Vui lòng nhập tên đăng nhập và mật khẩu.';
    });
  </script>
</body>
</html>
